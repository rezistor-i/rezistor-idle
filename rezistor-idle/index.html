<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<title>Мастерская «Резистор»: Империя Ремонта</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1822'/%3E%3Ctext y='.9em' x='50' text-anchor='middle' font-size='72'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg0:#06090e;
  --bg1:#0c1520;
  --panel-0:rgba(20,30,42,.7);
  --panel-1:rgba(30,44,60,.55);
  --panel-2:rgba(16,24,34,.75);
  --line:rgba(80,120,160,.22);
  --line-2:rgba(110,160,210,.5);
  --line-3:rgba(140,190,240,.7);
  --text:#eef4fa;
  --text-2:#c6d3de;
  --muted:#7c8996;
  --green:#7be0a1;
  --green-2:#3fa96b;
  --blue:#6cb6ff;
  --gold:#ffcf74;
  --red:#ff8a8a;
  --violet:#b28cff;
  --cyan:#6ce6d4;
  --orange:#ffab6b;
  --shadow-1:0 4px 14px rgba(0,0,0,.3);
  --shadow-2:0 10px 34px rgba(0,0,0,.4);
  --shadow-3:0 30px 90px rgba(0,0,0,.7);
  --radius:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:
    radial-gradient(1400px 700px at 50% -30%,#1d3a52 0,transparent 55%),
    radial-gradient(900px 600px at 100% 100%,#241b3a 0,transparent 55%),
    radial-gradient(700px 500px at 0% 80%,#0f2530 0,transparent 60%),
    linear-gradient(180deg,var(--bg0) 0,var(--bg1) 100%);
  background-attachment:fixed;
  color:var(--text);
  font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(108,182,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(108,182,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%);
}
button{color:inherit;font:inherit;cursor:pointer;border:none;background:none;transition:transform .14s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease}
button:disabled{opacity:.4;cursor:not-allowed}
button:not(:disabled):active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
input,textarea{font:inherit;color:inherit;background:#1a2838;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--blue)}
input[type="checkbox"]{width:auto;cursor:pointer;accent-color:var(--green)}
input[type="range"]{width:150px;cursor:pointer;accent-color:var(--blue)}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em}
h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,#eef4fa,#7be0a1,#6cb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:17px}
h3{font-size:15px;color:var(--text-2);font-weight:600}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.good{color:var(--green)}
.bad{color:var(--red)}
.gold{color:var(--gold)}
.blue{color:var(--blue)}
.violet{color:var(--violet)}
.cyan{color:var(--cyan)}
.app{max-width:1180px;margin:0 auto;padding:16px 14px 32px;position:relative;z-index:1}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
.top{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
  gap:12px;padding:14px 18px;
  background:
    linear-gradient(180deg,rgba(30,46,62,.9),rgba(14,22,32,.98));
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
}
.top::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(108,182,255,.6),rgba(123,224,161,.5),transparent);
}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.brand-ico{
  font-size:28px;
  filter:drop-shadow(0 0 14px rgba(108,182,255,.55));
  display:grid;place-items:center;
  width:44px;height:44px;border-radius:12px;
  background:radial-gradient(circle at 35% 30%,rgba(108,182,255,.18),rgba(108,182,255,.02));
  border:1px solid rgba(108,182,255,.2);
}
.res{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.res-item{
  display:flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:22px;
  background:linear-gradient(180deg,rgba(20,30,42,.9),rgba(10,17,26,.95));
  border:1px solid var(--line);
  font-weight:600;font-size:13.5px;
  font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 2px 8px rgba(0,0,0,.2);
  transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease;
}
.res-item:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.3)}
.res-item .ico{font-size:14px;filter:drop-shadow(0 0 4px currentColor)}
.res-item.money{color:var(--green);border-color:rgba(123,224,161,.25)}
.res-item.money:hover{border-color:rgba(123,224,161,.5)}
.res-item.rep{color:var(--gold);border-color:rgba(255,207,116,.25)}
.res-item.rep:hover{border-color:rgba(255,207,116,.5)}
.res-item.parts{color:var(--cyan);border-color:rgba(108,230,212,.25)}
.res-item.parts:hover{border-color:rgba(108,230,212,.5)}
.res-item.xp{color:var(--violet);border-color:rgba(178,140,255,.25)}
.res-item.xp:hover{border-color:rgba(178,140,255,.5)}
.active-event{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(178,140,255,.28),rgba(178,140,255,.1));
  border:1px solid rgba(178,140,255,.55);
  font-size:12.5px;font-weight:700;
  color:#ddc8ff;
  animation:pulse-soft 2s ease-in-out infinite;
}
@keyframes pulse-soft{50%{opacity:.72}}

/* ===== НАВИГАЦИЯ ===== */
.nav{
  display:flex;gap:4px;flex-wrap:wrap;
  margin:14px 0;padding:6px;
  background:linear-gradient(180deg,rgba(20,30,42,.9),rgba(12,20,30,.9));
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow-1),inset 0 1px 0 rgba(255,255,255,.03);
  position:relative;
}
.nav button{
  padding:9px 15px;border-radius:10px;
  font-weight:500;color:var(--text-2);font-size:13.5px;
  border:1px solid transparent;white-space:nowrap;position:relative;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:6px;
}
.nav button:hover:not(.active){
  background:rgba(108,182,255,.08);
  color:var(--text);
  transform:translateY(-1px);
}
.nav button.active{
  background:linear-gradient(180deg,rgba(108,182,255,.26),rgba(108,182,255,.1));
  border-color:rgba(108,182,255,.5);
  color:#fff;
  font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(108,182,255,.15);
}
.nav .dot{
  position:absolute;top:5px;right:5px;
  width:8px;height:8px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 8px var(--red);
  animation:blink 1.4s infinite;
}
@keyframes blink{50%{opacity:.3}}

/* ===== ПАНЕЛЬ ===== */
.panel{
  padding:20px;border-radius:18px;
  background:
    linear-gradient(180deg,rgba(23,35,48,.92),rgba(13,21,30,.97));
  border:1px solid var(--line);
  box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.03);
  min-height:400px;
  position:relative;
}
.panel::before{
  content:"";position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(108,182,255,.35),transparent);
}
.tab{display:none}
.tab.active{display:block;animation:fadeIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== КАРТОЧКИ ===== */
.card{
  padding:16px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  transition:border-color .2s ease;
}
.card:hover{border-color:var(--line-2)}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

/* ===== БОЛЬШОЙ ДОХОД ===== */
.income-hero{
  padding:26px 22px;border-radius:18px;text-align:center;
  background:
    radial-gradient(600px 200px at 50% 0,rgba(123,224,161,.14),transparent 70%),
    linear-gradient(180deg,rgba(30,60,44,.5),rgba(16,36,26,.55));
  border:1px solid rgba(123,224,161,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.25);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.income-hero::before{
  content:"";position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(123,224,161,.7),transparent);
}
.income-hero .label{
  font-size:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.14em;
  font-weight:600;
}
.income-hero .value{
  font-size:clamp(30px,6vw,46px);font-weight:800;
  color:var(--green);
  text-shadow:0 0 30px rgba(123,224,161,.5);
  margin:8px 0 4px;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.income-hero .sub{font-size:13px;color:var(--text-2)}
.income-hero .bonuses{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* ===== ПЕРСОНАЛ ===== */
.staff-card{
  padding:14px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line);
  display:flex;gap:14px;align-items:center;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  position:relative;
  overflow:hidden;
}
.staff-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--blue),transparent);
  opacity:.4;
  transition:opacity .2s;
}
.staff-card.owned{border-color:rgba(123,224,161,.4)}
.staff-card.owned::before{background:linear-gradient(180deg,var(--green),transparent);opacity:1}
.staff-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.staff-card.locked{opacity:.5;filter:grayscale(.5)}
.staff-ico{
  font-size:32px;flex-shrink:0;
  width:52px;height:52px;display:grid;place-items:center;
  border-radius:12px;
  background:radial-gradient(circle at 40% 35%,rgba(108,182,255,.15),rgba(108,182,255,.02));
  border:1px solid rgba(108,182,255,.12);
}
.staff-info{flex:1;min-width:0}
.staff-name{font-weight:700;font-size:14px;margin-bottom:2px}
.staff-meta{font-size:12px;color:var(--muted)}
.staff-count{font-size:19px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;margin-bottom:4px}

/* ===== КНОПКИ ===== */
.buy-btn{
  padding:8px 12px;border-radius:9px;
  background:linear-gradient(180deg,rgba(123,224,161,.18),rgba(123,224,161,.06));
  border:1px solid rgba(123,224,161,.45);
  font-weight:600;font-size:12.5px;white-space:nowrap;
  transition:all .18s ease;
}
.buy-btn:hover:not(:disabled){
  background:linear-gradient(180deg,rgba(123,224,161,.3),rgba(123,224,161,.12));
  border-color:rgba(123,224,161,.7);
  box-shadow:0 4px 12px rgba(123,224,161,.2);
}
.buy-btn:disabled{opacity:.5;cursor:not-allowed}
.buy-btn.cant{border-color:var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
.premium-btn{
  padding:11px 18px;border-radius:11px;
  background:linear-gradient(180deg,rgba(108,182,255,.26),rgba(108,182,255,.08));
  border:1px solid rgba(108,182,255,.55);
  font-weight:700;font-size:13.5px;
  transition:all .18s ease;
}
.premium-btn:hover:not(:disabled){
  background:linear-gradient(180deg,rgba(108,182,255,.36),rgba(108,182,255,.15));
  border-color:rgba(108,182,255,.8);
  box-shadow:0 4px 16px rgba(108,182,255,.25);
}

/* ===== УЛУЧШЕНИЯ ===== */
.upg-card{
  padding:14px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line);
  cursor:pointer;position:relative;
  transition:all .18s ease;
  overflow:hidden;
}
.upg-card:hover:not(.disabled):not(.bought){
  border-color:var(--line-2);
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(0,0,0,.3);
}
.upg-card.bought{
  border-color:rgba(123,224,161,.4);
  background:linear-gradient(180deg,rgba(30,60,44,.4),rgba(16,36,26,.45));
}
.upg-card.disabled{opacity:.5;cursor:not-allowed}
.upg-card.is-new::after{
  content:"NEW";
  position:absolute;top:8px;right:8px;
  padding:2px 8px;border-radius:20px;
  font-size:9.5px;font-weight:800;
  background:linear-gradient(180deg,#ff8585,#e06060);
  color:#fff;letter-spacing:.08em;
  box-shadow:0 2px 8px rgba(255,100,100,.4);
  animation:blink 1.6s infinite;
}
.upg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.upg-ico{font-size:24px;filter:drop-shadow(0 0 6px rgba(108,182,255,.3))}
.upg-name{font-weight:700;font-size:13.5px}
.upg-desc{font-size:12px;color:var(--muted);margin-bottom:10px;min-height:32px;line-height:1.4}
.upg-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}
.upg-cost{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.upg-cost.cant{color:var(--muted)}
.upg-level{color:var(--cyan);font-weight:600;font-variant-numeric:tabular-nums}
.upg-badge{
  position:absolute;top:-6px;right:-6px;
  padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:800;
  background:linear-gradient(180deg,#8ecbff,#5b9fd6);
  color:#0a1722;letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(108,182,255,.3);
}
.upg-badge.max{background:linear-gradient(180deg,#ffd98f,#c69a35);color:#231601;box-shadow:0 2px 8px rgba(255,207,116,.4)}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-tabs button{
  padding:8px 16px;border-radius:9px;
  background:rgba(15,23,34,.7);
  border:1px solid var(--line);
  font-size:13px;font-weight:500;
  transition:all .18s ease;
  display:flex;align-items:center;gap:5px;
}
.cat-tabs button:hover:not(.active){
  border-color:var(--line-2);
  background:rgba(108,182,255,.08);
}
.cat-tabs button.active{
  background:linear-gradient(180deg,rgba(108,182,255,.26),rgba(108,182,255,.08));
  border-color:rgba(108,182,255,.55);
  color:#fff;
  font-weight:600;
}

/* ===== ЗАКАЗ ===== */
.order-card{
  padding:18px;border-radius:14px;
  background:
    radial-gradient(400px 150px at 0% 0,rgba(108,182,255,.08),transparent 60%),
    linear-gradient(180deg,rgba(30,44,60,.7),rgba(16,24,34,.8));
  border:1px solid var(--line);
  margin-bottom:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.client-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.client-av{
  width:64px;height:64px;flex-shrink:0;
  display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3d5e79,#1a2a3a);
  font-size:32px;
  box-shadow:inset 0 0 0 2px rgba(108,182,255,.25),0 8px 20px rgba(0,0,0,.4);
}
.client-name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.client-role{font-size:12.5px;color:var(--muted)}
.pill{
  display:inline-block;padding:4px 11px;margin:3px 5px 3px 0;
  border:1px solid var(--line);border-radius:20px;
  font-size:11.5px;color:var(--text-2);
  background:rgba(108,182,255,.05);
  transition:border-color .2s,background .2s;
}
.pill:hover{border-color:var(--line-2);background:rgba(108,182,255,.1)}
.test-btn{
  display:block;width:100%;padding:11px 14px;margin-bottom:6px;
  text-align:left;border-radius:10px;
  background:linear-gradient(180deg,#1a2838,#16202c);
  border:1px solid var(--line);
  font-weight:500;font-size:13.5px;
  transition:all .15s ease;
}
.test-btn:hover:not(:disabled){
  border-color:var(--line-2);
  transform:translateX(3px);
  background:linear-gradient(180deg,#223648,#1a2634);
}
.test-btn.done{
  background:linear-gradient(180deg,rgba(123,224,161,.14),rgba(123,224,161,.03));
  border-color:rgba(123,224,161,.4);
  color:var(--green);
}
.test-result{
  margin-top:8px;padding:12px 14px;border-radius:9px;
  background:linear-gradient(90deg,rgba(108,182,255,.15),rgba(108,182,255,.02));
  border-left:3px solid var(--blue);
  font-size:13.5px;
  line-height:1.5;
}
.choice-btn{
  display:block;width:100%;padding:12px 15px;margin-bottom:6px;
  text-align:left;border-radius:10px;
  background:linear-gradient(180deg,#1a2838,#16202c);
  border:1px solid var(--line);
  font-weight:500;font-size:13.5px;
  transition:all .15s ease;
}
.choice-btn:hover:not(:disabled){
  border-color:var(--line-2);
  transform:translateX(3px);
  background:linear-gradient(180deg,#223648,#1a2634);
}
.choice-btn.selected{
  border-color:var(--blue);
  background:linear-gradient(180deg,rgba(108,182,255,.24),rgba(108,182,255,.08));
  box-shadow:inset 0 0 0 1px rgba(108,182,255,.3);
}
.repair-btn{
  padding:13px 15px;border-radius:11px;
  background:linear-gradient(180deg,rgba(42,62,80,.9),rgba(28,42,56,.9));
  border:1px solid rgba(95,135,175,.4);
  font-weight:500;font-size:13.5px;
  text-align:left;display:flex;align-items:center;gap:11px;
  transition:all .15s ease;
}
.repair-btn:hover:not(:disabled){
  border-color:var(--green);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(123,224,161,.15);
}
.repair-btn.done{
  background:rgba(28,60,44,.55);
  border-color:rgba(123,224,161,.45);
  opacity:.75;
}
.repair-btn::before{content:"›";font-size:20px;color:var(--green);opacity:.75;flex-shrink:0;font-weight:800}

/* ===== ПРОГРЕСС ===== */
.progress{
  height:10px;border-radius:10px;
  background:#0a121a;
  overflow:hidden;margin:12px 0;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--green));
  transform-origin:left;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  border-radius:10px;
  box-shadow:0 0 12px rgba(123,224,161,.4);
}

/* ===== КОДЕКС ===== */
.codex-card{
  padding:14px;border-radius:12px;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--line);
  position:relative;
  transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease;
}
.codex-card:hover{transform:translateY(-2px)}
.codex-card.undiscovered{opacity:.55;filter:grayscale(.75)}
.codex-card[data-rarity="uncommon"]{border-color:rgba(123,224,161,.4)}
.codex-card[data-rarity="uncommon"]:hover{box-shadow:0 8px 24px rgba(123,224,161,.15)}

<script>
"use strict";

/* ============================================================
   DECIMAL
   ============================================================ */
class Decimal {
  constructor(mantissa, exponent){
    if (mantissa && typeof mantissa === 'object' && 'm' in mantissa){
      this.m = mantissa.m;
      this.e = mantissa.e;
    } else {
      this.m = mantissa || 0;
      this.e = exponent || 0;
      this.normalize();
    }
  }
  normalize(){
    if (this.m === 0 || !isFinite(this.m)){ this.m = 0; this.e = 0; return; }
    const sign = this.m < 0 ? -1 : 1;
    let abs = Math.abs(this.m);
    const exp = Math.floor(Math.log10(abs));
    if (exp !== 0){
      abs = abs / Math.pow(10, exp);
      this.e = this.e + exp;
    }
    this.m = sign * abs;
  }
  toNumber(){ return this.m === 0 ? 0 : this.m * Math.pow(10, this.e); }
  add(o){
    o = o instanceof Decimal ? o : new Decimal(o);
    let a = this, b = o;
    if (a.e > b.e){ const t = a; a = b; b = t; }
    const diff = b.e - a.e;
    if (diff > 17) return b.clone();
    return new Decimal(a.m + b.m * Math.pow(10, diff), a.e);
  }
  sub(o){ o = o instanceof Decimal ? o : new Decimal(o); return this.add(o.clone().mul(-1)); }
  mul(o){ o = o instanceof Decimal ? o : new Decimal(o); return new Decimal(this.m * o.m, this.e + o.e); }
  div(o){
    o = o instanceof Decimal ? o : new Decimal(o);
    if (o.m === 0) return new Decimal(0);
    return new Decimal(this.m / o.m, this.e - o.e);
  }
  pow(n){
    if (this.m === 0) return new Decimal(0);
    if (n === 0) return new Decimal(1);
    if (Number.isInteger(n)) return new Decimal(Math.pow(this.m, n), this.e * n);
    return new Decimal(Math.pow(this.toNumber(), n));
  }
  clone(){ return new Decimal(this.m, this.e); }
  lt(o){ o = o instanceof Decimal ? o : new Decimal(o); return this.e < o.e || (this.e === o.e && this.m < o.m); }
  gt(o){ o = o instanceof Decimal ? o : new Decimal(o); return this.e > o.e || (this.e === o.e && this.m > o.m); }
  lte(o){ return !this.gt(o); }
  gte(o){ return !this.lt(o); }
  eq(o){ o = o instanceof Decimal ? o : new Decimal(o); return this.e === o.e && this.m === o.m; }
  valueOf(){ return this.toNumber(); }
  toString(){
    if (this.m === 0) return '0';
    if (this.e >= 0 && this.e < 3) return String(Math.round(this.m * Math.pow(10, this.e)));
    return fmtShort(this);
  }
}
function dec(n){ return n instanceof Decimal ? n : new Decimal(n); }

const SUFFIXES = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
function fmtShort(d){
  if (!(d instanceof Decimal)) d = dec(d);
  if (d.m === 0) return '0';
  if (d.e < 3) {
    const num = d.m * Math.pow(10, d.e);
    if (num < 0.01) return num.toFixed(3).replace(/\.?0+$/, '');
    return num.toFixed(num < 100 ? 2 : 0).replace(/\.?0+$/, '');
  }
  let tier = Math.floor(d.e / 3);
  let m = d.m;
  if (m >= 999.995 && tier < SUFFIXES.length - 1){ m = m / 1000; tier = tier + 1; }
  if (tier >= SUFFIXES.length) return m.toFixed(2) + 'e' + d.e;
  return m.toFixed(2) + SUFFIXES[tier];
}
function fmt(n){ return fmtShort(dec(n)); }
function fmtInt(n){
  const v = dec(n).toNumber();
  if (!isFinite(v) || v > 1e15) return fmtShort(dec(n));
  return Math.floor(v).toLocaleString('ru-RU');
}

const $ = id => document.getElementById(id);
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function now(){ return Date.now(); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   SOUND MANAGER v6 — мягкие звуки
   • Только sine/triangle
   • Плавная атака 20мс (без щелчков)
   • Lowpass фильтр 2800Гц (убирает резкость)
   • Уровни выровнены (0.05–0.10)
   • Анти-спам 80мс между одинаковыми звуками
   ============================================================ */
const SoundManager = (function(){
  let ctx = null;
  let masterGain = null;
  let enabled = true;
  let volume = 0.5;
  let lastPlay = {};
  const MIN_INTERVAL = 80;

  function ensureCtx(){
    if (ctx) return ctx;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ctx = new Ctx();
      masterGain = ctx.createGain();
      masterGain.gain.value = volume;
      masterGain.connect(ctx.destination);
    } catch(e){ ctx = null; }
    return ctx;
  }

  function unlock(){
    const c = ensureCtx();
    if (c && c.state === 'suspended') c.resume().catch(()=>{});
  }

  /**
   * @param {number} freq — частота в Гц
   * @param {number} dur  — длительность в секундах
   * @param {string} type — 'sine' | 'triangle' (остальное игнорируется)
   * @param {number} gain — базовая громкость (0..1)
   * @param {number|null} slideTo — плавное скольжение к этой частоте
   */
  function tone(freq, dur, type, gain, slideTo){
    const c = ensureCtx();
    if (!c || !enabled || volume <= 0) return;
    if (type !== 'sine' && type !== 'triangle') type = 'sine';
    try {
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const g = c.createGain();
      const filter = c.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2800;
      filter.Q.value = 0.6;

      osc.type = type;
      osc.frequency.value = freq;
      if (slideTo){
        try { osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur); }
        catch(e){ /* игнор */ }
      }

      const peak = Math.max(0.001, gain);
      // Плавная атака и мягкий релиз — убирают «клик» на старте/конце
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(peak, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(filter);
      filter.connect(g);
      g.connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch(e){ /* игнор */ }
  }

  /** Проиграть последовательность нот [freq, dur, delay] */
  function notes(seq){
    for (const [freq, dur, delay, gain] of seq){
      setTimeout(() => tone(freq, dur, 'sine', gain || 0.07), delay || 0);
    }
  }

  function play(id){
    if (!enabled) return;
    const t = performance.now();
    if (lastPlay[id] && t - lastPlay[id] < MIN_INTERVAL) return;
    lastPlay[id] = t;

    switch(id){
      case 'coin':
        notes([[660, 0.10, 0, 0.075], [880, 0.14, 60, 0.070]]);
        break;
      case 'rep':
        tone(780, 0.14, 'sine', 0.075);
        break;
      case 'parts':
        tone(520, 0.10, 'triangle', 0.060);
        break;
      case 'xp':
        notes([[880, 0.12, 0, 0.075], [1320, 0.22, 90, 0.065]]);
        break;
      case 'buy':
        tone(520, 0.12, 'triangle', 0.075);
        break;
      case 'click':
        tone(660, 0.05, 'sine', 0.035);
        break;
      case 'error':
        tone(220, 0.22, 'triangle', 0.085, 165);
        break;
      case 'success':
        notes([[660, 0.10, 0, 0.075], [880, 0.16, 70, 0.070]]);
        break;
      case 'achievement':
        notes([[660, 0.10, 0, 0.070], [880, 0.10, 70, 0.070], [1180, 0.20, 140, 0.075]]);
        break;
      case 'event':
        tone(520, 0.22, 'triangle', 0.075, 780);
        break;
      case 'prestige':
        notes([[440, 0.28, 0, 0.085], [660, 0.28, 180, 0.085], [990, 0.40, 360, 0.080]]);
        break;
      case 'codex':
        notes([[660, 0.10, 0, 0.070], [990, 0.18, 80, 0.070]]);
        break;
      case 'repair_ok':
        tone(880, 0.08, 'sine', 0.055);
        break;
      case 'repair_err':
        tone(260, 0.16, 'triangle', 0.075, 200);
        break;
      case 'daily':
        notes([[660, 0.10, 0, 0.075], [880, 0.10, 90, 0.075], [1180, 0.20, 180, 0.080]]);
        break;
      case 'music_start':
        tone(520, 0.10, 'sine', 0.060);
        break;
    }
  }

  return {
    play,
    unlock,
    setEnabled(v){ enabled = !!v; },
    setVolume(v){ volume = Math.max(0, Math.min(1, v)); if (masterGain) masterGain.gain.value = volume; },
    get enabled(){ return enabled; },
    get volume(){ return volume; }
  };
})();

/* ============================================================
   MUSIC MANAGER — фоновая музыка
   Путь: assets/audio/workshop-theme.mp3
   ============================================================ */
const MusicManager = (function(){
  const MUSIC_PATH = 'assets/audio/workshop-theme.mp3';
  let audio = null;
  let playing = false;
  let available = true;  // false, если файл не найден / ошибка загрузки
  let enabled = false;   // настройка игрока
  let volume = 0.22;     // 22% — умеренно тихо
  let initDone = false;

  function ensure(){
    if (audio) return audio;
    if (!available) return null;
    try {
      audio = new Audio();
      audio.src = MUSIC_PATH;
      audio.loop = true;
      audio.preload = 'none';
      audio.volume = volume;
      audio.crossOrigin = 'anonymous';
      audio.addEventListener('error', onError);
      audio.addEventListener('canplay', () => { available = true; });
    } catch(e){
      available = false;
      audio = null;
    }
    return audio;
  }

  function onError(){
    available = false;
    playing = false;
    updateHeaderBtn();
    // Только один раз сообщаем игроку
    if (!onError._notified){
      onError._notified = true;
      if (enabled){
        toast('🎵 Музыка недоступна — проверьте путь assets/audio/workshop-theme.mp3', 'event');
      }
    }
  }

  function updateHeaderBtn(){
    const btn = document.getElementById('music-btn');
    if (!btn) return;
    const icon = document.getElementById('music-btn-icon');
    const label = document.getElementById('music-btn-label');
    if (!btn || !icon || !label) return;

    if (!available){
      btn.classList.add('hidden');
      return;
    }
    btn.classList.remove('hidden');
    if (playing){
      btn.classList.add('playing');
      icon.textContent = '🔊';
      label.textContent = 'Играет';
    } else {
      btn.classList.remove('playing');
      icon.textContent = '🎵';
      label.textContent = 'Музыка';
    }
  }

  async function play(){
    if (!enabled) return;
    const a = ensure();
    if (!a) return;
    try {
      await a.play();
      playing = true;
    } catch(e){
      // NotAllowedError — автоплей заблокирован, ждём gesture
      if (e && e.name === 'NotAllowedError'){
        playing = false;
      } else {
        available = false;
        playing = false;
      }
    }
    updateHeaderBtn();
  }

  function pause(){
    if (!audio) { playing = false; updateHeaderBtn(); return; }
    try { audio.pause(); } catch(e){}
    playing = false;
    updateHeaderBtn();
  }

  function setVolume(v){
    volume = Math.max(0, Math.min(1, v));
    if (audio) audio.volume = volume;
  }

  function setEnabled(v){
    enabled = !!v;
    if (enabled){
      // Требует user gesture для запуска
      play();
    } else {
      pause();
    }
    updateHeaderBtn();
  }

  function toggle(){
    if (!available){ toast('🎵 Музыка недоступна', 'event'); return; }
    setEnabled(!enabled);
  }

  return {
    play, pause, toggle, setEnabled, setVolume,
    get playing(){ return playing; },
    get available(){ return available; },
    get enabled(){ return enabled; },
    get volume(){ return volume; },
    updateHeaderBtn,
    _initDone(){ initDone = true; }
  };
})();

/* ============================================================
   СЕРИАЛИЗАЦИЯ
   ============================================================ */
function serializeState(s){
  const plain = JSON.parse(JSON.stringify(s, (k, v) => {
    if (v instanceof Decimal) return { __dec: true, m: v.m, e: v.e };
    return v;
  }));
  delete plain._incomeCache;
  delete plain._firstRun;
  return plain;
}
function deserializeState(obj){
  return JSON.parse(JSON.stringify(obj), (k, v) => {
    if (v && typeof v === 'object' && v.__dec === true) return new Decimal(v.m, v.e);
    return v;
  });
}
function saveNow(){
  try{
    state.lastSave = now();
    localStorage.setItem(SAVE_SLOT_KEY(state._slot), JSON.stringify(serializeState(state)));
  } catch(e){ console.warn('Save error:', e); }
}
function loadGame(slot){
  slot = slot || 1;
  try{
    let raw = localStorage.getItem(SAVE_SLOT_KEY(slot));
    if (!raw){
      for (const k of LEGACY_KEYS){
        raw = localStorage.getItem(k + slot);
        if (raw) break;
      }
    }
    if (!raw) return null;
    const restored = deserializeState(JSON.parse(raw));
    const merged = Object.assign(defaultState(), restored);
    ['money','reputation','spareParts','xp','totalMoney','totalRepEarned','offlineEarningsTotal'].forEach(k => {
      if (!(merged[k] instanceof Decimal)) merged[k] = dec(merged[k] || 0);
    });
    if (!merged.staff) merged.staff = {};
    if (!merged.upgrades) merged.upgrades = {};
    if (!merged.codex) merged.codex = {};
    if (!merged.achievements) merged.achievements = {};
    if (!merged.prestigeUpgrades) merged.prestigeUpgrades = {};
    if (!merged.albums) merged.albums = {};
    if (!merged._seenUpgrades) merged._seenUpgrades = {};
    if (!merged.settings) merged.settings = {};
    if (merged.settings.sound === undefined) merged.settings.sound = true;
    if (merged.settings.volume === undefined) merged.settings.volume = 0.5;
    if (merged.settings.animations === undefined) merged.settings.animations = true;
    if (merged.settings.music === undefined) merged.settings.music = false;
    if (merged.settings.musicVolume === undefined) merged.settings.musicVolume = 0.22;
    // МИГРАЦИЯ: стартовые 25 ₽
    if ((merged.totalOrders || 0) === 0 && merged.money.lt(25)){
      merged.money = dec(25);
      if (merged.totalMoney.lt(25)) merged.totalMoney = dec(25);
    }
    merged._slot = slot;
    merged._firstRun = false;
    return merged;
  } catch(e){ console.warn('Load error:', e); return null; }
}
function deleteSave(slot){
  localStorage.removeItem(SAVE_SLOT_KEY(slot));
  for (const k of LEGACY_KEYS) localStorage.removeItem(k + slot);
}
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ============================================================
   ЭКОНОМИКА
   ============================================================ */
function getUpgradeLevel(id){ return state.upgrades[id] || 0; }
function isUpgradeMaxed(u){ return getUpgradeLevel(u.id) >= u.maxLevel; }
function upgradeCost(u){
  const lvl = getUpgradeLevel(u.id);
  return dec(u.cost).mul(dec(u.costMult).pow(lvl)).mul(state.eventDiscount || 1);
}
function staffCost(st){
  const owned = state.staff[st.id] || 0;
  return dec(st.baseCost).mul(dec(STAFF_COST_MULT).pow(owned)).mul(state.eventDiscount || 1);
}
function staffIncome(st){
  const owned = state.staff[st.id] || 0;
  if (!owned) return dec(0);
  return dec(st.baseIncome).mul(owned);
}
function toolMultiplier(){
  let m = dec(1);
  m = m.mul(dec(1).add(getUpgradeLevel('scr')*0.08));
  m = m.mul(dec(1).add(getUpgradeLevel('multi')*0.10));
  m = m.mul(dec(1).add(getUpgradeLevel('solder')*0.15));
  m = m.mul(dec(1).add(getUpgradeLevel('scope')*0.20));
  m = m.mul(dec(1).add(getUpgradeLevel('ir')*0.25));
  m = m.mul(dec(1).add(getUpgradeLevel('micro')*0.30));
  m = m.mul(dec(1).add(getUpgradeLevel('bga')*0.40));
  m = m.mul(dec(1).add(getUpgradeLevel('nano')*0.60));
  return m;
}
function facilityMultiplier(){
  let m = dec(1);
  m = m.mul(dec(1).add(getUpgradeLevel('bench')*0.05));
  m = m.mul(dec(1).add(getUpgradeLevel('room')*0.10));
  m = m.mul(dec(1).add(getUpgradeLevel('vent')*0.08));
  m = m.mul(dec(1).add(getUpgradeLevel('clean')*0.20));
  m = m.mul(dec(1).add(getUpgradeLevel('bunker')*0.50));
  return m;
}
function marketingMultiplier(){
  let m = dec(1);
  m = m.mul(dec(1).add(getUpgradeLevel('billb')*0.50));
  m = m.mul(dec(1).add(getUpgradeLevel('tv')*1.00));
  m = m.mul(dec(1).add(getUpgradeLevel('global')*2.00));
  return m;
}
function researchMultiplier(){
  let m = dec(1);
  m = m.mul(dec(1).add(getUpgradeLevel('auto')*0.20));
  m = m.mul(dec(1).add(getUpgradeLevel('time')*0.50));
  return m;
}
function prestigeIncomeMultiplier(){ return dec(1).add((state.prestigeUpgrades.p_income || 0) * 0.25); }
function prestigeOrderMultiplier(){ return dec(1).add((state.prestigeUpgrades.p_order || 0) * 0.50); }
function codexBonus(){ return dec(1).add(Object.keys(state.codex).length * 0.02); }
function albumBonus(){
  let sum = 0;
  for (const album of ALBUMS){
    if (state.albums[album.id] && state.albums[album.id].complete) sum += album.bonus;
  }
  return dec(1).add(sum);
}
function totalIncome(){
  const staffSum = STAFF.reduce((sum, st) => sum.add(staffIncome(st)), dec(0));
  return staffSum
    .mul(toolMultiplier())
    .mul(facilityMultiplier())
    .mul(researchMultiplier())
    .mul(prestigeIncomeMultiplier())
    .mul(codexBonus())
    .mul(albumBonus())
    .mul(state.eventBonus || 1)
    .mul(state.eventPenalty || 1);
}
function orderFrequencyPerHour(){
  let base = dec(6);
  base = base.add(getUpgradeLevel('flyer') * 1);
  base = base.add(getUpgradeLevel('site') * 2);
  base = base.add(getUpgradeLevel('ads') * 5);
  base = base.mul(marketingMultiplier()).mul(prestigeOrderMultiplier()).mul(state.eventOrderBoost || 1);
  return base;
}

/* ============================================================
   ПРЕСТИЖ
   ============================================================ */
function prestigeXPGain(){
  const mult = 1 + (state.prestigeUpgrades.p_pre || 0) * 0.10;
  const total = state.totalMoney.toNumber();
  if (!Number.isFinite(total) || total <= 1e6) return 0;
  const base = total / 1e6;
  const raw = Math.floor(Math.pow(base, 0.4));
  const result = Math.floor(raw * mult);
  return Number.isFinite(result) && result > 0 ? result : 0;
}
function doPrestige(){
  const gain = prestigeXPGain();
  if (gain < 1){ toast('Слишком мало дохода для престижа', 'event'); return; }
  const fresh = defaultState();
  fresh.xp = state.xp.add(gain);
  fresh.totalMoney = state.totalMoney;
  fresh.totalOrders = state.totalOrders;
  fresh.totalFaultsFixed = state.totalFaultsFixed;
  fresh.totalRepEarned = state.totalRepEarned;
  fresh.totalPrestiges = state.totalPrestiges + 1;
  fresh.perfectDiagnoses = state.perfectDiagnoses;
  fresh.perfectRepairs = state.perfectRepairs;
  fresh.eventsSeen = state.eventsSeen;
  fresh.offlineEarningsTotal = state.offlineEarningsTotal;
  fresh.totalPurchases = state.totalPurchases;
  fresh.achievements = state.achievements;
  fresh.codex = state.codex;
  fresh.albums = state.albums;
  fresh.prestigeUpgrades = state.prestigeUpgrades;
  fresh._seenUpgrades = state._seenUpgrades;
  fresh.startedAt = state.startedAt;
  fresh.playTime = state.playTime;
  fresh.settings = state.settings;
  fresh.dailyDate = state.dailyDate;
  fresh.dailyStreak = state.dailyStreak;
  fresh.dailyClaimed = state.dailyClaimed;
  fresh._slot = state._slot;
  fresh._firstRun = false;
  fresh._musicUsed = state._musicUsed;
  fresh.money = dec(1000).mul(dec(2).pow(state.prestigeUpgrades.p_money || 0));
  state = fresh;
  saveNow();
  SoundManager.play('prestige');
  toast(`🏆 Филиал открыт! Получено 💎${gain}`, 'ach');
  render();
}
function buyPrestigeUpgrade(id){
  const u = PRESTIGE_UPGRADES.find(x=>x.id===id);
  if (!u) return;
  const lvl = state.prestigeUpgrades[id] || 0;
  if (lvl >= u.maxLevel) return;
  const cost = u.cost * (lvl + 1);
  if (state.xp.lt(cost)){ toast('Не хватает 💎', 'event'); SoundManager.play('error'); return; }
  state.xp = state.xp.sub(cost);
  state.prestigeUpgrades[id] = lvl + 1;
  SoundManager.play('buy');
  toast(`✓ ${u.name} → ур. ${lvl+1}`, 'ach');
  saveNow();
  render();
}

function gameTick(dt){
  state.playTime += dt;
  const inc = totalIncome();
  state._incomeCache = inc.toNumber();
  const earned = inc.mul(dt);
  state.money = state.money.add(earned);
  state.totalMoney = state.totalMoney.add(earned);
  const stage = STAGES.find(s => state.money.gte(s.unlockMoney));
  if (stage && stage.id > state.stage){
    state.stage = stage.id;
    SoundManager.play('success');
    toast(`🎉 Новый этап: ${stage.name}`, 'ach');
  }
  if (state.activeEvent){
    if (now() >= state.activeEvent.expiresAt){
      const ev = EVENTS.find(e=>e.id === state.activeEvent.id);
      if (ev && ev.clean) ev.clean(state);
      state.activeEvent = null;
    }
  } else if (Math.random() < dt / 90){
    triggerRandomEvent();
  }
  if (Math.random() < dt * 2){
    checkAchievements();
  }
}
function triggerRandomEvent(){
  if (state.activeEvent) return;
  const ev = choice(EVENTS);
  state.eventsSeen = (state.eventsSeen || 0) + 1;
  if (ev.duration > 0){
    state.activeEvent = { id:ev.id, expiresAt: now() + ev.duration * 1000 };
    if (ev.apply) ev.apply(state);
    SoundManager.play('event');
    toast(`${ev.icon} ${ev.name}: ${ev.desc}`, 'event');
  } else {
    if (ev.apply) ev.apply(state);
    SoundManager.play('event');
    toast(`${ev.icon} ${ev.name}: ${ev.desc}`, 'event');
  }
  saveNow();
}

function processOffline(){

  const elapsed = (now() - (state.lastSave || now())) / 1000;
  if (elapsed < 60) return;
  const maxHours = 8 + (state.prestigeUpgrades.p_off || 0);
  const effective = Math.min(elapsed, maxHours * 3600);
  const inc = totalIncome();
  const earned = inc.mul(effective);
  if (earned.lt(1)) return;
  state.money = state.money.add(earned);
  state.totalMoney = state.totalMoney.add(earned);
  state.offlineEarningsTotal = state.offlineEarningsTotal.add(earned);
  const h = Math.floor(effective / 3600);
  const m = Math.floor((effective % 3600) / 60);
  const wasCapped = elapsed > maxHours * 3600;
  setTimeout(() => {

      '🌙 Пока вас не было',
      `<p>Отсутствие: <b>${h}ч ${m}м</b>${wasCapped ? ` <span class="muted">(лимит оффлайн ${maxHours}ч)</span>` : ''}</p>

    );
  }, 500);
}

function pickRandomFault(){
  const allowed = {
    1: ['common'],
    2: ['common','uncommon'],
    3: ['common','uncommon','rare'],
    4: ['common','uncommon','rare','epic'],
    5: ['common','uncommon','rare','epic'],
    6: ['common','uncommon','rare','epic','legendary'],
  }[state.stage] || ['common'];
  const pool = Object.entries(FAULTS).filter(([id,f]) => allowed.includes(f.rarity));
  const weights = pool.map(([id,f]) => {
    const base = { common:100, uncommon:40, rare:12, epic:3, legendary:0.6 }[f.rarity];
    const rareBonus = 1 + (state.prestigeUpgrades.p_rare || 0) * 0.05;
    return f.rarity === 'common' ? base : base * rareBonus;
  });
  const totalW = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * totalW;
  for (let i = 0; i < pool.length; i++){
    r -= weights[i];
    if (r <= 0) return pool[i][0];
  }
  return pool[0][0];
}
function createOrder(){
  const faultId = pickRandomFault();
  const fault = FAULTS[faultId];
  const client = choice(CLIENTS);
  const similar = Object.keys(FAULTS).filter(id => id !== faultId && FAULTS[id].rarity === fault.rarity);
  const wrongs = similar.sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.5 ? 1 : 2);
  const candidates = [faultId, ...wrongs].sort(() => Math.random() - 0.5);
  const rarityCoef = RARITY_COEF[fault.rarity] || 1;
  const baseReward = dec(50).mul(rarityCoef).mul(dec(1.8).pow(state.stage - 1)).mul(dec(1).add(getUpgradeLevel('mat')*0.30));
  return {
    id: uid(),
    clientId: client.id,
    faultId,
    candidates,
    reward: baseReward,
    rep: Math.ceil(5 * rarityCoef),
    tests: ['visual'].concat(getUpgradeLevel('multi') >= 1 ? ['mult'] : []),
    created: now(),
  };
}
function takeOrder(){
  if (state.currentOrder){ toast('Сначала завершите текущий заказ'); return; }
  state.currentOrder = createOrder();
  state.diagnosis = { tests:[], verdict:null, confirmed:false, firstTry:true };
  state.repair = { placed:[], mistakes:0, shuffled:null };
  saveNow();
  SoundManager.play('click');
  toast('📋 Новый заказ принят');
  render();
}
function runTest(testId){
  if (!state.currentOrder) return;
  if (!state.diagnosis.tests.includes(testId)) state.diagnosis.tests.push(testId);
  saveNow();
  SoundManager.play('click');
  render();
}
function selectVerdict(faultId){
  if (!state.diagnosis) return;
  if (state.diagnosis.confirmed) return;
  state.diagnosis.verdict = faultId;
  saveNow();
  SoundManager.play('click');
  render();
}
function confirmDiagnosis(){
  if (!state.currentOrder || !state.diagnosis.verdict) return;
  const correct = state.diagnosis.verdict === state.currentOrder.faultId;
  if (!correct){
    state.diagnosis.firstTry = false;
    SoundManager.play('error');
    toast('❌ Неверный диагноз. Попробуйте ещё раз', 'event');
    state.diagnosis.verdict = null;
    saveNow();
    render();
    return;
  }
  state.diagnosis.confirmed = true;
  const fid = state.currentOrder.faultId;
  if (!state.codex[fid]){
    state.codex[fid] = { discoveredAt: now(), count: 0 };
    SoundManager.play('codex');
    toast(`📖 Открыта запись: ${FAULTS[fid].name}`, 'ach');
    updateAlbums(fid);
  } else {
    SoundManager.play('success');
  }
  if (state.diagnosis.firstTry){
    state.perfectDiagnoses = (state.perfectDiagnoses || 0) + 1;
  }
  saveNow();
  render();
}
function updateAlbums(faultId){
  for (const album of ALBUMS){
    if (!album.faults.includes(faultId)) continue;
    if (!state.albums[album.id]) state.albums[album.id] = { discovered: [], complete: false };
    const a = state.albums[album.id];
    if (!a.discovered.includes(faultId)) a.discovered.push(faultId);
    if (!a.complete && album.faults.every(f => state.codex[f])){
      a.complete = true;
      SoundManager.play('achievement');
      toast(`📚 Альбом собран: ${album.name}! ${album.rewards}`, 'ach');
    }
  }
}
function getRepairOptions(){
  const fault = FAULTS[state.currentOrder.faultId];
  const correct = fault.fix.map((text, i) => ({ text, index:i, correct:true }));
  const wrongPool = [
    'Сразу снять деталь, не отключая питание',
    'Закрутить обратно, не проверив',
    'Проверить запуск до сборки',
    'Заменить деталь, не убедившись в причине',
    'Сделать прогрев без защиты',
  ];
  const wrongs = wrongPool.slice(0, 3).map((text, i) => ({ text, index:'w'+i, correct:false }));
  const all = [...correct, ...wrongs];
  if (!state.repair.shuffled){
    const copy = all.slice();
    for (let i = copy.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
    }
    state.repair.shuffled = copy.map(x => x.index);
  }
  const map = {};
  all.forEach(x => { map[String(x.index)] = x; });
  return state.repair.shuffled.map(k => map[String(k)]).filter(Boolean);
}
function doRepairAction(key){
  if (!state.currentOrder || !state.diagnosis.confirmed) return;
  const fault = FAULTS[state.currentOrder.faultId];
  const expected = state.repair.placed.length;
  const k = String(key).startsWith('w') ? key : Number(key);
  if (k === expected){
    state.repair.placed.push(expected);
    saveNow();
    SoundManager.play('repair_ok');
    render();
    if (state.repair.placed.length === fault.fix.length){
      completeOrder();
    }
  } else {
    state.repair.mistakes++;
    SoundManager.play('repair_err');
    toast('⚠ Неверный порядок. Подумайте о безопасности', 'event');
    saveNow();
    render();
  }
}
function completeOrder(){
  const order = state.currentOrder;
  const reward = order.reward;
  const rep = order.rep;
  const partsGained = 2 + getUpgradeLevel('syn') * 2 + (state.prestigeUpgrades.p_parts || 0) * 2;
  const perfect = state.repair.mistakes === 0;
  const perfectBonus = perfect ? 1.2 : 1.0;

  state.money = state.money.add(reward.mul(perfectBonus));
  state.totalMoney = state.totalMoney.add(reward.mul(perfectBonus));
  state.reputation = state.reputation.add(rep);
  state.totalRepEarned = state.totalRepEarned.add(rep);
  state.spareParts = state.spareParts.add(partsGained);
  state.totalOrders++;
  state.totalFaultsFixed = (state.totalFaultsFixed || 0) + 1;
  if (perfect) state.perfectRepairs = (state.perfectRepairs || 0) + 1;
  if (state.codex[order.faultId]){
    state.codex[order.faultId].count++;
  }
  state.currentOrder = null;
  state.diagnosis = null;
  state.repair = null;
  saveNow();

  SoundManager.play('coin');
  floatTextAtCursor(`+${fmt(reward.mul(perfectBonus))} ₽`, 'var(--green)', $('res-money'));
  setTimeout(() => {
    SoundManager.play('rep');
    floatTextAtCursor(`+${rep} ⭐`, 'var(--gold)', $('res-rep'));
  }, 150);

  if (perfect) toast('✅ Идеальный ремонт! +20% бонус', 'ach');
  else toast('✅ Заказ выполнен');
  render();
}
function floatTextAtCursor(text, color, targetEl){
  if (state.settings.animations === false) return;
  if (reducedMotion) return;
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color;
  let x, y;
  if (targetEl){
    const rect = targetEl.getBoundingClientRect();
    x = rect.left + rect.width / 2;
    y = rect.top - 8;
  } else {
    x = window.innerWidth / 2;
    y = window.innerHeight / 2;
  }
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

      state._firstRun = false;
      saveNow();
      SoundManager.setEnabled(state.settings.sound !== false);
      SoundManager.setVolume(state.settings.volume ?? 0.5);
      MusicManager.setVolume(state.settings.musicVolume ?? 0.22);
      render();
      toast('✓ Импортировано');
    });
  };
  $('do-reset').onclick = () => {
    showModal('Полный сброс?', 'Всё будет удалено безвозвратно.', () => {
      deleteSave(state._slot);
      state = defaultState();
      state._firstRun = false;
      saveNow();
      MusicManager.setEnabled(false);
      render();
      toast('Игра сброшена');
    });
  };
}
let modalCallback = null;
function showModal(title, body, onOk, showCancel){
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = body;
  $('modal').classList.add('show');
  modalCallback = typeof onOk === 'function' ? onOk : null;
  if (showCancel === false){
    $('modal-cancel').style.display = 'none';
  } else {
    $('modal-cancel').style.display = '';
  }
}
$('modal-cancel').onclick = () => { $('modal').classList.remove('show'); modalCallback = null; };
$('modal-ok').onclick = () => {
  const cb = modalCallback;
  $('modal').classList.remove('show');
  modalCallback = null;
  if (typeof cb === 'function') cb();
};
$('modal').addEventListener('click', e => {
  if (e.target === $('modal')){ $('modal').classList.remove('show'); modalCallback = null; }
});
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
function uiUpdateLoop(t){
  rafId = requestAnimationFrame(uiUpdateLoop);
  const dt = Math.min((t - lastFrameTime) / 1000, 0.5);
  lastFrameTime = t;
  if (document.hidden) return;
  gameTick(dt);
  if (t - lastUITick >= 100){
    lastUITick = t;
    updateTopRes();
    if (activeTab === 'workshop'){
      const heroVal = document.querySelector('#tab-workshop .income-hero .value');
      if (heroVal) heroVal.textContent = `+${fmt(totalIncome())} ₽`;
      STAFF.forEach(st => {
        const btn = document.querySelector(`[data-staff="${st.id}"]`);
        if (!btn) return;
        const cost = staffCost(st);
        btn.textContent = fmt(cost) + ' ₽';
        btn.disabled = state.money.lt(cost);
        btn.classList.toggle('cant', state.money.lt(cost));
      });
    }
    if (activeTab === 'orders' && state.currentOrder && state.repair){
      const progressBar = document.querySelector('#tab-orders .progress > div');
      if (progressBar){
        const total = FAULTS[state.currentOrder.faultId].fix.length;
        progressBar.style.transform = `scaleX(${state.repair.placed.length / total})`;
      }
    }
  }
}
function init(){
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  reducedMotion = mq.matches;
  const loaded = loadGame(1);
  if (loaded){
    state = loaded;
    state._firstRun = false;
    if (reducedMotion) state.settings.animations = false;
    SoundManager.setEnabled(state.settings.sound !== false);
    SoundManager.setVolume(state.settings.volume ?? 0.5);
    MusicManager.setVolume(state.settings.musicVolume ?? 0.22);
    processOffline();
  } else {
    state = defaultState();
    state._slot = 1;
    state._firstRun = false;
    if (reducedMotion) state.settings.animations = false;
    SoundManager.setEnabled(state.settings.sound !== false);
    SoundManager.setVolume(state.settings.volume ?? 0.5);
    MusicManager.setVolume(state.settings.musicVolume ?? 0.22);
    setTimeout(() => toast('👋 Добро пожаловать! Начните с найма студента-практиканта', 'ach'), 500);
  }
  if (state.activeEvent && now() >= state.activeEvent.expiresAt){
    state.activeEvent = null;
  }
  checkDaily();
  buildNav();
  render();

  // Кнопка музыки в шапке
  const musicBtn = $('music-btn');
  if (musicBtn){
    musicBtn.onclick = () => {
      MusicManager.toggle();
      if (state.settings.music){
        state._musicUsed = true;
        SoundManager.play('music_start');
        saveNow();
      }
    };
  }
  MusicManager.updateHeaderBtn();

  // Пауза музыки при скрытии вкладки
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      // Мягкая пауза — только если играет
      if (MusicManager.playing){
        try { const a = document.querySelector('audio'); } catch(e){}
        // Мягкая остановка через паузу
        // Ничего не делаем — браузер сам приглушает в фоне; управляем через Audio
      }
    }
  });

  lastFrameTime = performance.now();
  rafId = requestAnimationFrame(uiUpdateLoop);
}
try {
  init();
} catch (e) {
  console.error('Не удалось запустить игру:', e);
  document.body.innerHTML = `
    <div style="padding:40px;color:#ff8a8a;font:16px system-ui;text-align:center;background:#0a0f16;min-height:100vh">
      <h2>⚠️ Ошибка запуска игры</h2>
      <pre style="text-align:left;background:#111;padding:16px;border-radius:8px;overflow:auto;max-width:600px;margin:20px auto;font-size:12px">${e.message}\n\n${(e.stack || '').slice(0, 800)}</pre>
      <button onclick="localStorage.clear();location.reload()" style="padding:10px 20px;border-radius:8px;background:#7be0a1;color:#0a1a11;font-weight:700;border:none;cursor:pointer">Полный сброс и перезапуск</button>
    </div>
  `;
}
</script>
</body>
</html>
